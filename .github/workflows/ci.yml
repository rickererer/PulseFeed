name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Check module hygiene
        run: |
          set +e
          TIDY_OUT="$(go mod tidy -diff 2>&1 | grep -v '^go: downloading')"
          TIDY_EXIT=$?
          VERIFY_OUT="$(go mod verify 2>&1)"
          VERIFY_EXIT=$?
          set -e
          echo "TIDY_EXIT=$TIDY_EXIT VERIFY_EXIT=$VERIFY_EXIT"
          echo "TIDY_OUT=$TIDY_OUT"
          echo "VERIFY_OUT=$VERIFY_OUT"
          if [ -n "$TIDY_OUT" ]; then
            echo "::error::go.mod/go.sum need tidy: $TIDY_OUT" | head -c 500
            exit 1
          fi
          if [ "$VERIFY_EXIT" -ne 0 ]; then
            echo "::error::go mod verify failed: $VERIFY_OUT"
            exit 1
          fi

      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=count

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -20

      # 覆盖率防退化门槛：基线 9.1%（2026-09），随测试补充逐步提高。
      # M1-M3 测试深化已使覆盖率翻倍；未覆盖部分主要为需要真实 DB/Redis
      # 的 infra 持久化层，后续里程碑继续补测后再抬阈值。
      - name: Enforce coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{gsub(/%/, "", $3); print $3}')
          THRESHOLD=8
          echo "total coverage: ${TOTAL}% (threshold ${THRESHOLD}%)"
          if awk "BEGIN{exit !(${TOTAL} < ${THRESHOLD})}"; then
            echo "::error::coverage ${TOTAL}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

  web:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
